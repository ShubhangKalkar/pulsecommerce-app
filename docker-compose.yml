services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulsecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulsecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@db:5432/pulsecommerce
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/srv/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
